name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AETHER_PG_DSN: postgres://aether:aether@127.0.0.1:55433/aether
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - name: Lint (rules from packs/platform-program lintRulePack)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (incl. conformance matrix + M1 gate proof)
        run: npm test
      - name: Secret scan (kernel + packs)
        run: node scripts/lint.mjs
      - name: Register projection sync check (§16.7 up-to-date with pack data)
        run: |
          npm run register:project
          git diff --exit-code docs/PLATFORM-PLAN.md || (echo "::error::§16.7 projection is stale — run npm run register:project" && exit 1)
      - name: Register consistency gate (§16.1-16 tables agree with live data)
        run: node scripts/check-register-consistency.mjs
