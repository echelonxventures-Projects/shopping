# One command: docker compose up  →  http://localhost:8787
services:
  aether:
    build: .
    environment:
      - AETHER_BIND_HOST=0.0.0.0
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
